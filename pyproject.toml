[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "maplepy"
version = "1.4.0"
description = "MAPLE (Madelung Part of Lattice Energy) from CIF files, and Hoppe's additivity theorem tested at database scale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nik Reeves-McLaren" }]
requires-python = ">=3.11"
keywords = ["crystallography", "MAPLE", "Madelung energy", "lattice energy",
            "additivity theorem", "crystal structure validation", "CIF", "ICSD"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pymatgen>=2024.2.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "adjustText>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
maplepy = "maplepy.cli:main_maplepy"
hopper = "maplepy.cli:main_hopper"

[project.urls]
Homepage = "https://github.com/SuperBladesman/MaplePy"
Issues = "https://github.com/SuperBladesman/MaplePy/issues"
Changelog = "https://github.com/SuperBladesman/MaplePy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/maplepy"]

# The reference tables live in data/ at the top of the repository, where the
# notebooks read them; the wheel carries a copy as maplepy/data.
[tool.hatch.build.targets.wheel.force-include]
"data" = "maplepy/data"

[tool.hatch.build.targets.sdist]
include = ["src/maplepy", "data", "tests", "examples", "tools", "README.md",
           "LICENSE", "CHANGELOG.md", "CITATION.cff", "MaplePy.ipynb",
           "Hopper.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
